name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the installer.
#   git tag v1.0.0 && git push origin v1.0.0
# A manual run (workflow_dispatch) builds everything as an artifact but publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Build HockeyScoreWidget.exe
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Build HockeyScoreWidget-Setup.exe
        env:
          # Manual run without a tag: placeholder number, Inno Setup needs one.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
        run: |
          choco install innosetup --version=6.4.3 -y --no-progress
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DNumVersion=$($version -replace '-.*', '')" installer\HockeyScoreWidget.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA256SUMS.txt
        shell: bash
        working-directory: dist
        run: sha256sum HockeyScoreWidget-Setup.exe HockeyScoreWidget.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/HockeyScoreWidget-Setup.exe
            dist/HockeyScoreWidget.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release, nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: sortie

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Installer"
            echo
            echo "Download **HockeyScoreWidget-Setup.exe** and run it. No administrator rights needed."
            echo
            echo "The program is not code-signed: Windows SmartScreen may show a warning. Click *More info* then *Run anyway*."
            echo
            echo "SHA-256:"
            echo
            sed 's/^/    /' sortie/SHA256SUMS.txt
          } > notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" sortie/HockeyScoreWidget-Setup.exe sortie/HockeyScoreWidget.exe sortie/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Hockey Score Widget $TAG" \
            --notes-file notes.md $prerelease
